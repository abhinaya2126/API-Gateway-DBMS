name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Install application dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix services/user-service
          npm ci --prefix services/product-service
          npm ci --prefix services/order-service
          npm ci --prefix services/payment-service
      - name: Create database from documented SQL order
        env:
          MYSQL_PWD: test
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root < database/schema.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root < database/seed.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root < database/indexes.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root < database/views.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root < database/procedures.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root < database/triggers.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root < database/migrations/001_api_gateway_configuration.sql
      - name: Start backend and mock services
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test
          DB_NAME: api_gateway_mgmt
          JWT_SECRET: ci-test-secret
          CORS_ORIGIN: http://localhost:5173
        run: |
          node start-all.js > /tmp/api-gateway.log 2>&1 &
          sleep 3
      - name: Run Newman integration collection
        run: npx --yes newman run "postman/API Gateway Management System.postman_collection.json"